name: converged-modeling-patterns
on:
  push:
    branches: [main]
    paths:
      - 'labs/converged-modeling-patterns/**'
      - '.github/workflows/converged-modeling-patterns.yml'
  pull_request:
    paths:
      - 'labs/converged-modeling-patterns/**'
      - '.github/workflows/converged-modeling-patterns.yml'
  schedule:
    - cron: '41 6 * * *'   # nightly: substantive freshness, not cosmetic
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Generous: this lab builds a large image (Oracle AI Database 26ai Free + ORDS
    # + mongosh) before validating both lanes.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: labs/converged-modeling-patterns
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build the lab image (DB + ORDS + mongosh)
        run: docker compose build

      - name: Validate both lanes (SQL + Oracle API for MongoDB)
        # run.sh brings the stack up, waits for the database AND the MongoDB API,
        # then runs every pattern across BOTH lanes — grading each .sql and .js;
        # the cross-API parity scripts exit non-zero on mismatch. It ends with a
        # combined "N passed, 0 failed" and a non-zero exit if anything failed.
        run: ./run.sh
